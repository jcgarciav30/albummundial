<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Export · Álbum Mundial 2026</title>
<style>
  :root{
    --bg:#0a1628; --panel:#0f1f33; --panel2:#13263c;
    --gold:#ffce3a; --gold2:#e0a800; --green:#3ddc84; --red:#ff5b6e;
    --line:#22384f; --txt:#e8eef6; --dim:#7f93a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #15304d 0%, var(--bg) 60%);
    color:var(--txt); font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    min-height:100vh; padding:24px 16px 60px;
  }
  .wrap{max-width:560px;margin:0 auto}
  h1{
    font-size:13px; letter-spacing:3px; color:var(--gold);
    text-align:center; text-transform:uppercase; font-weight:800; margin-bottom:4px;
  }
  .sub{text-align:center;color:var(--dim);font-size:12px;margin-bottom:26px;letter-spacing:1px}
  .card{
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--line); border-radius:18px; padding:22px;
    box-shadow:0 18px 40px rgba(0,0,0,.35); margin-bottom:16px;
  }
  .big{font-size:64px;font-weight:900;color:var(--gold);text-align:center;line-height:1}
  .pct-label{text-align:center;color:var(--dim);font-size:13px;letter-spacing:2px;margin-top:8px}
  .bar{height:14px;background:#0a1322;border-radius:99px;margin-top:16px;overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center}
  .kpi .n{font-size:30px;font-weight:900}
  .kpi .l{font-size:10px;color:var(--dim);letter-spacing:1.5px;margin-top:4px;text-transform:uppercase}
  .n.green{color:var(--green)} .n.red{color:var(--red)} .n.gold{color:var(--gold)}
  button{
    width:100%; border:none; cursor:pointer; font-weight:800; letter-spacing:1px;
    border-radius:14px; padding:18px; font-size:15px; text-transform:uppercase;
    transition:transform .12s ease, filter .2s ease;
  }
  button:active{transform:scale(.98)}
  .btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1300;box-shadow:0 10px 24px rgba(224,168,0,.35)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--dim);margin-top:10px;font-size:12px}
  .btn-gold:disabled{filter:grayscale(.6) brightness(.7);cursor:default}
  .status{text-align:center;font-size:12px;color:var(--dim);margin:14px 0 4px;min-height:18px}
  .status.ok{color:var(--green)} .status.err{color:var(--red)}
  .foot{text-align:center;color:#4d617a;font-size:10px;margin-top:24px;letter-spacing:1px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--dim);margin-right:6px;vertical-align:middle}
  .dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <h1>★ Exportar Álbum Mundial 2026 ★</h1>
  <div class="sub">Samuel &amp; César · lee Firebase y baja el JSON</div>

  <div class="card">
    <div class="big" id="pct">—</div>
    <div class="pct-label" id="pctLabel">conectando…</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="n green" id="kTengo">0</div><div class="l">Tengo</div></div>
    <div class="kpi"><div class="n red" id="kFaltan">0</div><div class="l">Faltan</div></div>
    <div class="kpi"><div class="n gold" id="kTotal">994</div><div class="l">Total</div></div>
  </div>

  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Iniciando…</span></div>

  <button class="btn-gold" id="btnJson" disabled>⬇ Descargar JSON</button>
  <button class="btn-ghost" id="btnReload">↻ Recargar desde Firebase</button>

  <div class="foot">album-mundial-2026 · colección «marks» · solo lectura</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const CONFIG = {
  apiKey: "AIzaSyCeCYwBkm9esC1EBPOT5r_jezZfPlHAL7U",
  authDomain: "album-mundial-2026-e7d91.firebaseapp.com",
  projectId: "album-mundial-2026-e7d91",
  storageBucket: "album-mundial-2026-e7d91.firebasestorage.app",
  messagingSenderId: "741259125705",
  appId: "1:741259125705:web:5040e3585f94883ddcbe18"
};

const TOTAL = 994;
const $ = id => document.getElementById(id);
let app, db, ownedList = [];

function setStatus(txt, cls=""){
  $("statusText").textContent = txt;
  $("status").className = "status " + cls;
  $("dot").className = "dot" + (cls==="ok"?" live":"");
}

async function load(){
  $("btnJson").disabled = true;
  ownedList = [];
  setStatus("Leyendo Firebase…");
  try{
    if(!app){ app = initializeApp(CONFIG); db = getFirestore(app); }
    const snap = await getDocs(collection(db, "marks"));
    snap.forEach(d=>{
      const v = d.data() || {};
      // owned true (o doc sin campo owned pero existente = tener, según lógica de la app)
      if(v.owned === true || v.owned === undefined) ownedList.push(d.id);
    });
    // dedupe + sort
    ownedList = [...new Set(ownedList)].sort();
    render();
    setStatus("Conectado · datos en vivo", "ok");
    $("btnJson").disabled = false;
  }catch(e){
    console.error(e);
    setStatus("Error: " + (e.message||e), "err");
  }
}

function render(){
  const tengo = ownedList.length;
  const faltan = TOTAL - tengo;
  const pct = Math.round(tengo/TOTAL*100);
  $("pct").textContent = pct + "%";
  $("pctLabel").textContent = tengo + " de " + TOTAL + " cartas";
  $("fill").style.width = pct + "%";
  $("kTengo").textContent = tengo;
  $("kFaltan").textContent = faltan;
  $("kTotal").textContent = TOTAL;
}

$("btnJson").addEventListener("click", ()=>{
  const payload = {
    proyecto: "album-mundial-2026",
    generado: new Date().toISOString(),
    total: TOTAL,
    tengo: ownedList.length,
    faltan: TOTAL - ownedList.length,
    owned: ownedList
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  const fecha = new Date().toISOString().slice(0,10);
  a.href = URL.createObjectURL(blob);
  a.download = `album_owned_${fecha}.json`;
  a.click();
  setStatus("JSON descargado ✓", "ok");
});

$("btnReload").addEventListener("click", load);
load();
</script>
</body>
</html>
