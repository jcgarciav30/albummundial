<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartas marcadas - Album Mundial 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
  body {
    background: linear-gradient(135deg, #0a1628, #1a2e4a);
    color: white;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 8px; color: #f4c430; }
  .subtitle { color: #aaa; font-size: 13px; margin-bottom: 20px; }
  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .input-row > div { display: flex; flex-direction: column; }
  label { font-size: 12px; color: #aaa; margin-bottom: 4px; }
  .date-input, .time-input {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    color: white;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
    width: 100%;
    color-scheme: dark;
  }
  button {
    background: linear-gradient(135deg, #00d97e, #00a85f);
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    width: 100%;
    cursor: pointer;
    text-transform: uppercase;
    margin: 10px 0;
  }
  button:active { opacity: 0.7; }
  button.secondary {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    margin: 5px 0;
    padding: 10px;
    font-size: 12px;
  }
  .quick-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .status {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 13px;
    text-align: center;
  }
  .status.loading { background: rgba(255,193,7,0.2); border: 1px solid #f4c430; }
  .status.success { background: rgba(0,217,126,0.2); border: 1px solid #00d97e; }
  .status.error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; }
  .stats-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .stat-value { font-size: 26px; font-weight: 900; color: #f4c430; line-height: 1; margin-bottom: 4px; }
  .stat-label { font-size: 10px; color: #aaa; letter-spacing: 1px; text-transform: uppercase; }
  .card-list { display: flex; flex-direction: column; gap: 6px; }
  .card-item {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-item.new { border-left: 3px solid #00d97e; }
  .card-item.repe { border-left: 3px solid #f4c430; }
  .card-info { flex: 1; min-width: 0; }
  .card-id {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    font-weight: bold;
    color: #f4c430;
    margin-bottom: 2px;
  }
  .card-name {
    font-size: 12px;
    color: white;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-time { font-size: 10px; color: #888; margin-left: 8px; text-align: right; white-space: nowrap; }
  .card-badge {
    font-size: 9px;
    padding: 3px 6px;
    border-radius: 5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-left: 6px;
    white-space: nowrap;
  }
  .badge-new { background: rgba(0,217,126,0.2); color: #00d97e; }
  .badge-repe { background: rgba(244,196,48,0.2); color: #f4c430; }
  .group-header {
    margin: 16px 0 6px;
    font-size: 12px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .debug {
    margin-top: 20px;
    padding: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    font-family: monospace;
    font-size: 11px;
    color: #aaa;
    max-height: 200px;
    overflow: auto;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📅 Cartas marcadas - Album Mundial 2026</h1>
  <p class="subtitle">Consulta cartas marcadas en cualquier rango de fechas</p>
  
  <div class="quick-buttons">
    <button class="secondary" onclick="quickRange('hoy')">📅 Hoy</button>
    <button class="secondary" onclick="quickRange('ayer')">📅 Ayer</button>
    <button class="secondary" onclick="quickRange('semana')">📅 7 días</button>
  </div>
  
  <div class="input-row">
    <div>
      <label>Desde:</label>
      <input type="datetime-local" id="dateFrom" class="date-input">
    </div>
    <div>
      <label>Hasta:</label>
      <input type="datetime-local" id="dateTo" class="date-input">
    </div>
  </div>
  
  <button onclick="consultar()">🔍 Consultar</button>
  
  <div id="status"></div>
  <div id="results"></div>
  <div id="debug" class="debug" style="display:none;"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCeCYwBkm9esC1EBPOT5r_jezZfPlHAL7U",
  authDomain: "album-mundial-2026-e7d91.firebaseapp.com",
  projectId: "album-mundial-2026-e7d91",
  storageBucket: "album-mundial-2026-e7d91.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const PLAYERS_DATA_URL = 'https://jcgarciav30.github.io/albummundial/index.html';
let PLAYERS = {};

async function loadPlayers() {
  try {
    const res = await fetch(PLAYERS_DATA_URL);
    const html = await res.text();
    const m = html.match(/const PLAYERS\s*=\s*(\{[^;]+?\});/s);
    if (m) {
      PLAYERS = JSON.parse(m[1]);
      console.log('PLAYERS loaded:', Object.keys(PLAYERS).length, 'teams');
    }
  } catch(e) {
    console.error('Error loading PLAYERS:', e);
  }
}

function getPlayerName(cardId) {
  const m = cardId.match(/^([A-Z]+)(\d+)$/);
  if (!m) return cardId;
  const code = m[1];
  const num = m[2];
  
  if (code === 'FWC') return num === '0' ? 'FWC 00 - Logo Panini' : `FWC ${num}`;
  if (code === 'CC') return `Coca-Cola Star ${num}`;
  
  if (PLAYERS[code] && PLAYERS[code][num]) {
    return `${PLAYERS[code][num]}`;
  }
  return cardId;
}

function setStatus(msg, type='loading') {
  const el = document.getElementById('status');
  el.className = `status ${type}`;
  el.textContent = msg;
}

function setDebug(msg) {
  const el = document.getElementById('debug');
  el.style.display = 'block';
  el.textContent = msg;
}

window.quickRange = function(range) {
  const now = new Date();
  let from, to;
  
  if (range === 'hoy') {
    from = new Date(now);
    from.setHours(0, 0, 0, 0);
    to = new Date(now);
    to.setHours(23, 59, 59, 999);
  } else if (range === 'ayer') {
    from = new Date(now);
    from.setDate(from.getDate() - 1);
    from.setHours(0, 0, 0, 0);
    to = new Date(now);
    to.setDate(to.getDate() - 1);
    to.setHours(23, 59, 59, 999);
  } else if (range === 'semana') {
    from = new Date(now);
    from.setDate(from.getDate() - 7);
    from.setHours(0, 0, 0, 0);
    to = new Date(now);
  }
  
  document.getElementById('dateFrom').value = toLocalInput(from);
  document.getElementById('dateTo').value = toLocalInput(to);
  consultar();
};

function toLocalInput(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}T${hh}:${mi}`;
}

window.consultar = async function() {
  document.getElementById('results').innerHTML = '';
  document.getElementById('debug').style.display = 'none';
  setStatus('Cargando datos de jugadores...', 'loading');
  
  if (Object.keys(PLAYERS).length === 0) {
    await loadPlayers();
  }
  
  const fromStr = document.getElementById('dateFrom').value;
  const toStr = document.getElementById('dateTo').value;
  
  if (!fromStr) {
    setStatus('⚠️ Seleccioná una fecha "Desde"', 'error');
    return;
  }
  
  const fromDate = new Date(fromStr);
  const toDate = toStr ? new Date(toStr) : new Date();
  
  setStatus('🔍 Descargando cartas desde Firebase...', 'loading');
  
  try {
    // Como updated_at se guarda como string ISO, descargamos TODO
    // y filtramos en cliente (única forma confiable)
    const marksRef = collection(db, 'marks');
    const snapshot = await getDocs(marksRef);
    
    const allCards = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      let ts = null;
      
      // updated_at puede ser string ISO o Timestamp
      if (data.updated_at) {
        if (typeof data.updated_at === 'string') {
          ts = new Date(data.updated_at);
        } else if (data.updated_at.toDate) {
          ts = data.updated_at.toDate();
        } else if (data.updated_at.seconds) {
          ts = new Date(data.updated_at.seconds * 1000);
        }
      }
      
      allCards.push({ id: doc.id, ...data, ts });
    });
    
    // Filtrar en cliente por rango de fechas
    const filtered = allCards.filter(c => {
      if (!c.ts) return false;
      return c.ts >= fromDate && c.ts <= toDate;
    });
    
    // Ordenar por fecha descendente
    filtered.sort((a, b) => b.ts - a.ts);
    
    setStatus(`✅ Total en base: ${allCards.length} cartas · En el rango: ${filtered.length}`, 'success');
    
    // Debug: si no hay resultados, mostrar ejemplos de timestamps
    if (filtered.length === 0 && allCards.length > 0) {
      const samples = allCards.slice(0, 5).map(c => `${c.id}: ${c.ts ? c.ts.toLocaleString('es-CR') : '(sin fecha)'}`).join('\n');
      setDebug('No hay cartas en ese rango. Ejemplos de cartas en la base:\n\n' + samples);
      return;
    }
    
    if (filtered.length === 0) {
      setStatus('🔭 No hay cartas marcadas en ese rango', 'success');
      return;
    }
    
    renderResults(filtered);
    
  } catch (e) {
    console.error(e);
    setStatus('❌ Error: ' + e.message, 'error');
  }
};

function renderResults(cards) {
  const container = document.getElementById('results');
  
  const total = cards.length;
  const conRepes = cards.filter(c => c.repes && c.repes > 0).length;
  const equipos = new Set(cards.map(c => c.id.match(/^[A-Z]+/)?.[0]).filter(Boolean)).size;
  
  let html = `
    <div class="stats-summary">
      <div class="stat-card">
        <div class="stat-value">${total}</div>
        <div class="stat-label">Cartas</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${equipos}</div>
        <div class="stat-label">Equipos</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${conRepes}</div>
        <div class="stat-label">Con repes</div>
      </div>
    </div>
  `;
  
  // Agrupar por equipo
  const byTeam = {};
  cards.forEach(c => {
    const team = c.id.match(/^[A-Z]+/)?.[0] || 'OTROS';
    if (!byTeam[team]) byTeam[team] = [];
    byTeam[team].push(c);
  });
  
  const teamCodes = Object.keys(byTeam).sort();
  
  for (const team of teamCodes) {
    const teamCards = byTeam[team];
    teamCards.sort((a, b) => {
      const na = parseInt(a.id.replace(/[A-Z]/g, '')) || 0;
      const nb = parseInt(b.id.replace(/[A-Z]/g, '')) || 0;
      return na - nb;
    });
    
    html += `<div class="group-header">${team} · ${teamCards.length} cartas</div>`;
    html += '<div class="card-list">';
    
    for (const card of teamCards) {
      const playerName = getPlayerName(card.id);
      const time = card.ts ? card.ts.toLocaleString('es-CR', { 
        day: '2-digit', month: '2-digit',
        hour: '2-digit', minute: '2-digit' 
      }) : '';
      const isRepe = card.repes && card.repes > 0;
      
      html += `
        <div class="card-item ${isRepe ? 'repe' : 'new'}">
          <div class="card-info">
            <div class="card-id">${card.id}</div>
            <div class="card-name">${playerName}</div>
          </div>
          <div class="card-time">${time}</div>
          <span class="card-badge ${isRepe ? 'badge-repe' : 'badge-new'}">
            ${isRepe ? `⭐ ${card.repes}` : '🟢'}
          </span>
        </div>
      `;
    }
    
    html += '</div>';
  }
  
  container.innerHTML = html;
}

// Auto-completar "Desde" con hoy 00:00
window.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  document.getElementById('dateFrom').value = toLocalInput(today);
  
  const now = new Date();
  document.getElementById('dateTo').value = toLocalInput(now);
  
  loadPlayers();
});
</script>
</body>
</html>
