<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartas marcadas hoy - Album Mundial 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
  body {
    background: linear-gradient(135deg, #0a1628, #1a2e4a);
    color: white;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #f4c430;
  }
  .subtitle {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .date-input {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    color: white;
    padding: 12px;
    border-radius: 12px;
    font-size: 16px;
    width: 100%;
    margin-bottom: 12px;
  }
  button {
    background: linear-gradient(135deg, #00d97e, #00a85f);
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    width: 100%;
    cursor: pointer;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  button:active { opacity: 0.7; }
  .status {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 14px;
    text-align: center;
  }
  .status.loading { background: rgba(255,193,7,0.2); border: 1px solid #f4c430; }
  .status.success { background: rgba(0,217,126,0.2); border: 1px solid #00d97e; }
  .status.error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; }
  .stats-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 900;
    color: #f4c430;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 10px;
    color: #aaa;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-item {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-item.new {
    border-left: 4px solid #00d97e;
  }
  .card-item.repe {
    border-left: 4px solid #f4c430;
  }
  .card-info {
    flex: 1;
  }
  .card-id {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    color: #f4c430;
    margin-bottom: 2px;
  }
  .card-name {
    font-size: 13px;
    color: white;
  }
  .card-time {
    font-size: 11px;
    color: #888;
    margin-left: 12px;
    text-align: right;
  }
  .card-badge {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-left: 8px;
  }
  .badge-new { background: rgba(0,217,126,0.2); color: #00d97e; }
  .badge-repe { background: rgba(244,196,48,0.2); color: #f4c430; }
  .group-header {
    margin: 20px 0 8px;
    font-size: 13px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
</style>
</head>
<body>
<div class="container">
  <h1>📅 Cartas marcadas - Album Mundial 2026</h1>
  <p class="subtitle">Mostrá las cartas marcadas desde una fecha y hora específica</p>
  
  <label style="font-size:13px;color:#aaa;margin-bottom:4px;display:block;">Desde:</label>
  <input type="datetime-local" id="dateFrom" class="date-input">
  
  <label style="font-size:13px;color:#aaa;margin-bottom:4px;display:block;">Hasta (opcional):</label>
  <input type="datetime-local" id="dateTo" class="date-input">
  
  <button onclick="consultar()">🔍 Consultar</button>
  
  <div id="status"></div>
  <div id="results"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCeCYwBkm9esC1EBPOT5r_jezZfPlHAL7U",
  authDomain: "album-mundial-2026-e7d91.firebaseapp.com",
  projectId: "album-mundial-2026-e7d91",
  storageBucket: "album-mundial-2026-e7d91.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Mapa de IDs a nombres de jugadores (extraído de PLAYERS de tu index.html)
const PLAYERS_DATA_URL = 'https://jcgarciav30.github.io/albummundial/index.html';
let PLAYERS = {};

async function loadPlayers() {
  try {
    const res = await fetch(PLAYERS_DATA_URL);
    const html = await res.text();
    const m = html.match(/const PLAYERS\s*=\s*(\{[^;]+?\});/s);
    if (m) {
      PLAYERS = JSON.parse(m[1]);
      console.log('PLAYERS loaded:', Object.keys(PLAYERS).length, 'teams');
    }
  } catch(e) {
    console.error('Error loading PLAYERS:', e);
  }
}

function getPlayerName(cardId) {
  // Parsear ID: "ARG17" -> code=ARG, num=17
  const m = cardId.match(/^([A-Z]+)(\d+)$/);
  if (!m) return cardId;
  const code = m[1];
  const num = m[2];
  
  if (code === 'FWC') return num === '0' ? 'FWC 00 - Logo Panini' : `FWC ${num}`;
  if (code === 'CC') return `Coca-Cola Star ${num}`;
  
  if (PLAYERS[code] && PLAYERS[code][num]) {
    return PLAYERS[code][num];
  }
  return cardId;
}

function setStatus(msg, type='loading') {
  const el = document.getElementById('status');
  el.className = `status ${type}`;
  el.textContent = msg;
}

window.consultar = async function() {
  document.getElementById('results').innerHTML = '';
  setStatus('Cargando datos de jugadores...', 'loading');
  
  if (Object.keys(PLAYERS).length === 0) {
    await loadPlayers();
  }
  
  const fromStr = document.getElementById('dateFrom').value;
  const toStr = document.getElementById('dateTo').value;
  
  if (!fromStr) {
    setStatus('⚠️ Seleccioná una fecha "Desde"', 'error');
    return;
  }
  
  const fromDate = new Date(fromStr);
  const toDate = toStr ? new Date(toStr) : new Date();
  
  setStatus('🔍 Consultando Firebase...', 'loading');
  
  try {
    const marksRef = collection(db, 'marks');
    const q = query(
      marksRef,
      where('updated_at', '>=', Timestamp.fromDate(fromDate)),
      where('updated_at', '<=', Timestamp.fromDate(toDate)),
      orderBy('updated_at', 'desc')
    );
    
    const snapshot = await getDocs(q);
    const cards = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      cards.push({
        id: doc.id,
        ...data,
        ts: data.updated_at ? data.updated_at.toDate() : null
      });
    });
    
    if (cards.length === 0) {
      setStatus('🔭 No hay cartas en ese rango de fechas', 'success');
      return;
    }
    
    setStatus(`✅ Encontradas ${cards.length} cartas`, 'success');
    renderResults(cards);
    
  } catch (e) {
    console.error(e);
    setStatus('❌ Error: ' + e.message, 'error');
  }
};

function renderResults(cards) {
  const container = document.getElementById('results');
  
  // Estadísticas
  const total = cards.length;
  const conRepes = cards.filter(c => c.repes && c.repes > 0).length;
  const equipos = new Set(cards.map(c => c.id.match(/^[A-Z]+/)?.[0]).filter(Boolean)).size;
  
  let html = `
    <div class="stats-summary">
      <div class="stat-card">
        <div class="stat-value">${total}</div>
        <div class="stat-label">Cartas</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${equipos}</div>
        <div class="stat-label">Equipos</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${conRepes}</div>
        <div class="stat-label">Con repes</div>
      </div>
    </div>
  `;
  
  // Agrupar por equipo
  const byTeam = {};
  cards.forEach(c => {
    const team = c.id.match(/^[A-Z]+/)?.[0] || 'OTROS';
    if (!byTeam[team]) byTeam[team] = [];
    byTeam[team].push(c);
  });
  
  // Ordenar equipos alfabéticamente
  const teamCodes = Object.keys(byTeam).sort();
  
  for (const team of teamCodes) {
    const teamCards = byTeam[team];
    // Ordenar dentro del equipo por número de carta
    teamCards.sort((a, b) => {
      const na = parseInt(a.id.replace(/[A-Z]/g, '')) || 0;
      const nb = parseInt(b.id.replace(/[A-Z]/g, '')) || 0;
      return na - nb;
    });
    
    html += `<div class="group-header">${team} · ${teamCards.length} cartas</div>`;
    html += '<div class="card-list">';
    
    for (const card of teamCards) {
      const playerName = getPlayerName(card.id);
      const time = card.ts ? card.ts.toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit' }) : '';
      const isRepe = card.repes && card.repes > 0;
      
      html += `
        <div class="card-item ${isRepe ? 'repe' : 'new'}">
          <div class="card-info">
            <div class="card-id">${card.id}</div>
            <div class="card-name">${playerName}</div>
          </div>
          <div class="card-time">${time}</div>
          <span class="card-badge ${isRepe ? 'badge-repe' : 'badge-new'}">
            ${isRepe ? `⭐ ${card.repes}` : '🟢 NUEVA'}
          </span>
        </div>
      `;
    }
    
    html += '</div>';
  }
  
  container.innerHTML = html;
}

// Auto-completar fecha "Desde" con hoy 00:00
window.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  document.getElementById('dateFrom').value = `${yyyy}-${mm}-${dd}T00:00`;
  
  loadPlayers();
});
</script>
</body>
</html>
